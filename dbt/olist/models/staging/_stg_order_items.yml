version: 2

models:
  - name: stg_order_items
    description: >
      One row per item within an order. An order with 3 units of a product has
      3 rows. Key is order_id + order_item_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        description: Links to stg_orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        description: Item number within the order (1, 2, 3...).
        data_tests:
          - not_null
      - name: product_id
        description: Links to stg_products.
        data_tests:
          - not_null
          # - relationships:
          #     arguments:
          #       to: ref('stg_products')
          #       field: product_id
      - name: seller_id
        description: Links to stg_sellers.
        data_tests:
          - not_null
          # - relationships:
          #     arguments:
          #       to: ref('stg_sellers')
          #       field: seller_id
      - name: shipping_limit_at
        description: >
          The seller shipping limit date for handling the order 
          over to the logistic partner.
        data_tests:
          - not_null
      - name: price
        description: item price in Brazilian reais (BRL), excluding freight
        data_tests:
          - not_null
      - name: freight_value
        description: >
          Freight cost for this item 
          When an order has several items, the freight is split across them.
        data_tests:
          - not_null

    